{% extends 'base.html' %}

{% block header %}{% endblock %}
{% block footer %}{% endblock %}

{% block content %}
<style>
    .page-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-color: #5b8fa8;
        background-image: url('https://images.unsplash.com/photo-1500382017468-9049fed747ef?w=1920&auto=format&fit=crop&q=80');
        background-size: cover;
        background-position: center;
    }
    .login-container { position: relative; z-index: 10; }
</style>

<div class="page-bg"></div>

<div class="min-h-screen flex items-center justify-center py-12 px-4 relative">
    <div class="max-w-md w-full login-container">
        <div class="bg-white rounded-xl shadow-lg p-8">
            <div class="text-center mb-8">
                <div class="mx-auto h-16 w-16 flex items-center justify-center rounded-full bg-green-100 mb-4">
                    <i class="fas fa-seedling text-green-600 text-3xl"></i>
                </div>
                <h2 class="text-3xl font-bold text-green-800">Welcome Back</h2>
                <p class="text-gray-600 mt-2">Login to your account</p>
            </div>
            
       
            
            <form method="post">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                        <input type="email" name="email" required class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="your@email.com">
                    </div>
                    
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                        <div class="relative">
                            <input type="password" id="passwordInput" name="password" required class="w-full px-4 py-3 pr-12 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-transparent" placeholder="Enter password">
                            <button type="button" onclick="togglePasswordVisibility()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700 transition-colors">
                                <i id="passwordIcon" class="fas fa-eye text-lg"></i>
                            </button>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-3 px-4 rounded-lg transition-colors mt-6">
                    Login
                </button>

                <div class="mt-3 text-center">
                    <a href="#" class="text-sm text-gray-600 hover:text-green-600 font-medium transition-colors">
                        <i class="fas fa-key mr-1"></i>Forgot Password?
                    </a>
                </div>
            </form>
            
            <div class="mt-6 text-center border-t border-gray-200 pt-6">
                <p class="text-sm text-gray-600">
                    Don't have an account?
                    <a href="{% url 'register' %}" class="text-green-600 hover:text-green-800 font-medium">Register</a>
                </p>
            </div>
        </div>
    </div>
</div>

<script>
    function togglePasswordVisibility() {
        const passwordInput = document.getElementById('passwordInput');
        const passwordIcon = document.getElementById('passwordIcon');
        
        if (passwordInput.type === 'password') {
            passwordInput.type = 'text';
            passwordIcon.classList.remove('fa-eye');
            passwordIcon.classList.add('fa-eye-slash');
        } else {
            passwordInput.type = 'password';
            passwordIcon.classList.remove('fa-eye-slash');
            passwordIcon.classList.add('fa-eye');
        }
    }
</script>
{% endblock %}
