<div id="toast-container" class="fixed top-4 right-4 z-50 space-y-3 max-w-md w-full"></div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        function showToast(message, type = 'info') {
            const toastContainer = document.getElementById('toast-container');
            if (!toastContainer) return;

            const toastId = 'toast-' + Date.now();
            const icons = {
                'success': 'fa-check-circle',
                'error': 'fa-exclamation-circle',
                'warning': 'fa-exclamation-triangle',
                'info': 'fa-info-circle'
            };
            
            const colors = {
                'success': {
                    bg: 'bg-green-50',
                    border: 'border-green-200',
                    text: 'text-green-800',
                    icon: 'text-green-600',
                    close: 'text-green-600 hover:text-green-800'
                },
                'error': {
                    bg: 'bg-red-50',
                    border: 'border-red-200',
                    text: 'text-red-800',
                    icon: 'text-red-600',
                    close: 'text-red-600 hover:text-red-800'
                },
                'warning': {
                    bg: 'bg-yellow-50',
                    border: 'border-yellow-200',
                    text: 'text-yellow-800',
                    icon: 'text-yellow-600',
                    close: 'text-yellow-600 hover:text-yellow-800'
                },
                'info': {
                    bg: 'bg-blue-50',
                    border: 'border-blue-200',
                    text: 'text-blue-800',
                    icon: 'text-blue-600',
                    close: 'text-blue-600 hover:text-blue-800'
                }
            };

            const color = colors[type] || colors['info'];
            const icon = icons[type] || icons['info'];

            const toast = document.createElement('div');
            toast.id = toastId;
            toast.className = `${color.bg} ${color.border} border-l-4 rounded-lg shadow-lg p-4 flex items-start gap-3 animate-slide-in-right`;
            toast.innerHTML = `
                <div class="flex-shrink-0">
                    <i class="fas ${icon} ${color.icon} text-xl"></i>
                </div>
                <div class="flex-1 ${color.text}">
                    <p class="text-sm font-medium">${message}</p>
                </div>
                <button onclick="closeToast('${toastId}')" class="flex-shrink-0 ${color.close} transition-colors">
                    <i class="fas fa-times"></i>
                </button>
            `;

            toastContainer.appendChild(toast);

            setTimeout(() => {
                closeToast(toastId);
            }, 5000);
        }

        window.closeToast = function(toastId) {
            const toast = document.getElementById(toastId);
            if (toast) {
                toast.style.animation = 'slide-out-right 0.3s ease-out';
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }
        };

        window.showToast = showToast;

        {% if messages %}
            {% for message in messages %}
                {% if message.tags == 'error' or message.tags == 'danger' %}
                    showToast('{{ message|escapejs }}', 'error');
                {% elif message.tags == 'success' %}
                    showToast('{{ message|escapejs }}', 'success');
                {% elif message.tags == 'warning' %}
                    showToast('{{ message|escapejs }}', 'warning');
                {% else %}
                    showToast('{{ message|escapejs }}', 'info');
                {% endif %}
            {% endfor %}
        {% endif %}
    });
</script>

<style>
    @keyframes slide-in-right {
        from {
            transform: translateX(100%);
            opacity: 0;
        }
        to {
            transform: translateX(0);
            opacity: 1;
        }
    }
    
    @keyframes slide-out-right {
        from {
            transform: translateX(0);
            opacity: 1;
        }
        to {
            transform: translateX(100%);
            opacity: 0;
        }
    }
    
    .animate-slide-in-right {
        animation: slide-in-right 0.3s ease-out;
    }
    
    @media (max-width: 640px) {
        #toast-container {
            right: 1rem;
            left: 1rem;
            max-width: 100%;
        }
    }
</style>
