<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Krishi Connect - Smart Agriculture Portal{% endblock %}</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌱</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 min-h-screen">
    {% block header %}
    {% include 'components/header.html' %}
    {% endblock %}
    
    <main class="flex-1">
        {% block content %}
        {% endblock %}
    </main>
    
    {% block footer %}
    {% include 'components/footer.html' %}
    {% endblock %}
    
    {% include 'components/toast.html' %}

    <!-- Cart Modal Popup -->
    <div id="cart-modal" class="fixed inset-0 z-[9999] flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black/40" onclick="hideCartModal()"></div>
        <div class="relative bg-white rounded-2xl shadow-2xl px-10 py-8 w-[380px] max-w-sm mx-4">
            <button onclick="hideCartModal()" class="absolute top-4 right-4 text-gray-400 hover:text-gray-700 transition-colors">
                <i class="fas fa-times text-lg"></i>
            </button>
            <div class="flex items-center gap-3">
                <i class="fas fa-check-circle text-green-500 text-2xl"></i>
                <p class="text-green-600 font-bold text-lg">Added to cart successfully!</p>
            </div>
        </div>
    </div>

    <script>
        let cartModalTimer;

        function showCartModal() {
            document.getElementById('cart-modal').classList.remove('hidden');
            clearTimeout(cartModalTimer);
            cartModalTimer = setTimeout(hideCartModal, 3000);
        }

        function hideCartModal() {
            document.getElementById('cart-modal').classList.add('hidden');
        }

        document.addEventListener('DOMContentLoaded', function () {
            document.querySelectorAll('form[action*="cart/add"]').forEach(function (form) {
                form.addEventListener('submit', function (e) {
                    e.preventDefault();
                    fetch(form.action, {
                        method: 'POST',
                        body: new FormData(form),
                        headers: { 'X-Requested-With': 'XMLHttpRequest' }
                    }).finally(showCartModal);
                });
            });
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenuButton = document.getElementById('mobile-menu-button');
            const mobileMenu = document.getElementById('mobile-menu');
            
            if (mobileMenuButton && mobileMenu) {
                mobileMenuButton.addEventListener('click', function() {
                    mobileMenu.classList.toggle('hidden');
                });
            }
        });
    </script>
    
    {% block extra_js %}
    {% endblock %}
</body>
</html>
