{% extends 'base.html' %}
{% block title %}List a Product — Krishi Connect{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
    <h1 class="text-2xl font-bold text-green-800 mb-6">🌾 List a New Product</h1>

    <form method="post" enctype="multipart/form-data" class="bg-white rounded-2xl shadow p-6 space-y-4">
        {% csrf_token %}
        {% for field in form %}
        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <p class="text-red-500 text-xs mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700 font-semibold">
            List Product
        </button>
    </form>
</div>

<style>
    input, select, textarea {
        width: 100%;
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 0.5rem;
        font-size: 0.875rem;
        outline: none;
    }
    input:focus, select:focus, textarea:focus {
        border-color: #16a34a;
        box-shadow: 0 0 0 2px rgba(22,163,74,0.2);
    }
</style>
{% endblock %}
